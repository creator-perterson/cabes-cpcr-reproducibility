name: bounded-validation

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded validation dependencies
        run: python -m pip install -r environment/fixed-pool-requirements.txt -r environment/statistics-requirements.txt
      - name: Run bounded tests
        run: python -m unittest discover -s tests -v
      - name: Recompute Level 1
        run: python scripts/recompute_level1.py
      - name: Recompute full R14 statistics
        run: python scripts/recompute_full_statistics.py --output-dir results/local/full_statistics
      - name: Run Level 2 smoke path
        run: python scripts/run_level2_smoke.py
      - name: Run Level 3 preflight
        run: python scripts/run_level3.py --check
      - name: Scan release boundary
        run: python scripts/scan_release_boundary.py --fail-on-history
